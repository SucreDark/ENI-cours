# ============================================================
#  Config du site "Mes cours ENI"
#  Tu n'as presque jamais besoin de toucher ce fichier :
#  pour ajouter un cours, crée juste un .md dans docs/modules/<module>/
# ============================================================
site_name: Mes cours ENI
site_description: Tous mes cours ENI (actuels et à venir), rangés par module
site_author: Sucre
use_directory_urls: false   # indispensable pour ouvrir le site en double-cliquant (sans serveur)

theme:
  name: material
  language: fr
  icon:
    logo: material/console
  font: false                  # police embarquée (stylesheets/police.css) : rien à télécharger
  palette:                     # sombre "terminal" par défaut, clair en option
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode clair
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/console
        name: Mode terminal
  features:
    - navigation.tabs          # un onglet par grande rubrique en haut
    - navigation.indexes       # la page index.md d'un dossier = page du module
    - navigation.top           # bouton "remonter"
    - navigation.footer        # cours précédent / suivant en bas de page
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy        # bouton "copier" sur les blocs de commandes
    - content.tooltips         # jolies infobulles (sigles)

hooks:
  - tools/hooks.py             # régénère quiz/flashcards/commandes/glossaire/fiches + recherche hors ligne

plugins:
  - search:
      lang: fr
  - tags                       # étiquettes : en cours / à venir / terminé
  - offline                    # le site généré marche sans serveur ni internet 

extra_css:
  - stylesheets/extra.css
  - stylesheets/cours.css   # couleur + logo de chaque cours (généré)
  - stylesheets/police.css  # JetBrains Mono embarquée
  - stylesheets/geek.css    # thème terminal
  - stylesheets/apps.css    # outils de révision, terminal caché, badges

extra_javascript:
  - javascripts/mermaid.min.js   # copie locale : les schémas marchent même sans internet
  - javascripts/donnees.js       # données générées (exos, commandes, sigles…)
  - javascripts/site.js          # thèmes, badges, carnet, terminal caché
  - javascripts/exos.js          # exercices interactifs + couleur du cours
  - javascripts/apps.js          # quiz, examen, flashcards, outils, accueil…
  - javascripts/simu.js          # simulateur de terminal

markdown_extensions:
  - admonition                 # encadrés !!! note / tip / warning
  - pymdownx.details           # encadrés repliables ??? (corrections d'exos)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid        # schémas dessinés en texte
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys              # ++ctrl+alt+del++
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:            # icônes :material-lan: etc.
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - abbr                       # sigles : infobulle au survol
  - pymdownx.snippets:
      auto_append:
        - includes/abreviations.md   # liste générée automatiquement
  - tables
  - toc:
      permalink: true

